<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NSE Picks</title>
<meta name="description" content="Paper-trade tracker for NSE stock lists: intraday buy and sell, swing, results jump and 20-day hold, with live profit and loss.">
<meta name="theme-color" content="#0b7e6a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="app-icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#f3f5f4;--panel:#fff;--soft:#f7f9f8;--fg:#121a16;--muted:#5f6d66;--line:#e2e8e5;
  --up:#0a8a54;--down:#d03c3c;--warn:#b26a0f;--accent:#0b7e6a;
  --c-buy:#0a8a54;--c-sell:#d03c3c;--c-swing:#2f6fd0;--c-res:#c27a0a;--c-hold:#7b55d1;--c-score:#56636c;
  --shadow:0 1px 2px rgba(15,25,20,.05),0 4px 14px -6px rgba(15,25,20,.12);
  --r:14px;--font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a0f0d;--panel:#121916;--soft:#0f1513;--fg:#e8efeb;--muted:#93a39b;--line:#22302a;
  --up:#3ccf8e;--down:#f26b6b;--warn:#eab05a;--accent:#3ccf8e;
  --c-buy:#3ccf8e;--c-sell:#f26b6b;--c-swing:#6aa3ff;--c-res:#f0b44c;--c-hold:#a98bff;--c-score:#9aa7b0;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px -8px rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a0f0d;--panel:#121916;--soft:#0f1513;--fg:#e8efeb;--muted:#93a39b;--line:#22302a;
  --up:#3ccf8e;--down:#f26b6b;--warn:#eab05a;--accent:#3ccf8e;
  --c-buy:#3ccf8e;--c-sell:#f26b6b;--c-swing:#6aa3ff;--c-res:#f0b44c;--c-hold:#a98bff;--c-score:#9aa7b0;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px -8px rgba(0,0,0,.6);color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 var(--font);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
a{color:var(--accent)}
[hidden]{display:none!important}
.up{color:var(--up)}.down{color:var(--down)}.muted{color:var(--muted)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding:0 max(14px,env(safe-area-inset-left)) 40px max(14px,env(safe-area-inset-right))}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .in{max-width:1080px;margin:0 auto;padding:10px max(14px,env(safe-area-inset-right)) 10px max(14px,env(safe-area-inset-left));display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;letter-spacing:-.01em;margin-right:auto}
.brand svg{width:28px;height:28px;border-radius:8px}
.clock{text-align:right;line-height:1.15}
.clock b{display:block;font-size:14px;font-weight:600}
.clock span{font-size:11px;color:var(--muted)}
.icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;cursor:pointer}
.icon-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}

/* market strip */
.market{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.market::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px;min-width:132px}
.chip small{display:block;font-size:11px;color:var(--muted);font-weight:500;letter-spacing:.02em}
.chip b{font-size:15px}
.chip i{font-style:normal;font-size:12px;margin-left:6px;font-weight:600}
.chip.mood{min-width:150px}
.chip.mood b{font-size:14px}

/* today box */
.today{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin:10px 0 0;box-shadow:var(--shadow)}
.today h2{margin:0 0 6px;font-size:14px;font-weight:700}
.today ul{margin:0;padding-left:18px;font-size:13.5px;display:grid;gap:4px}
.today li b{font-weight:600}
.today .more{margin-top:6px;font-size:13px}
.today summary{cursor:pointer;color:var(--muted);font-size:12.5px;margin-top:6px}

/* segment tabs */
.tabs{position:sticky;top:57px;z-index:15;background:var(--bg);margin:12px calc(-1 * max(14px,env(safe-area-inset-left))) 0;padding:8px max(14px,env(safe-area-inset-left));display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:13.5px;font-weight:600;white-space:nowrap}
.tab .dot{width:8px;height:8px;border-radius:50%;background:var(--seg)}
.tab .n{font-size:12px;font-weight:600;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--seg);border-color:var(--seg);color:#fff}
.tab[aria-selected="true"] .dot{background:#fff}.tab[aria-selected="true"] .n{color:#fff;opacity:.85}

/* segment panel */
.seg{padding-top:14px}
.seg-head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:6px 14px;margin-bottom:10px}
.seg-head h1{margin:0;font-size:20px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.seg-head h1::before{content:"";width:6px;height:22px;border-radius:3px;background:var(--seg)}
.seg-head .plan{flex-basis:100%;margin:0;font-size:13px;color:var(--muted)}
.total{margin-left:auto;text-align:right}
.total b{font-size:20px;display:block;line-height:1.1}
.total span{font-size:11.5px;color:var(--muted)}
.notes{display:grid;gap:6px;margin-bottom:12px}
.note{font-size:13px;padding:8px 12px;border-radius:10px;background:var(--soft);border:1px solid var(--line)}
.note.warn{border-color:color-mix(in srgb,var(--warn) 45%,var(--line));background:color-mix(in srgb,var(--warn) 8%,var(--panel))}
.note b{font-weight:600}
.day-label{display:flex;justify-content:space-between;align-items:baseline;margin:16px 2px 8px;font-size:13px;color:var(--muted);font-weight:600}
.day-label b{color:var(--fg)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px 12px 16px;box-shadow:var(--shadow);cursor:pointer;text-align:left;width:100%;display:grid;grid-template-columns:1fr auto;gap:2px 10px;transition:transform .15s,border-color .15s}
.card::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:0 4px 4px 0;background:var(--seg)}
.card:hover{border-color:color-mix(in srgb,var(--seg) 45%,var(--line))}
.card:active{transform:scale(.99)}
.card .sym{font-weight:700;font-size:15.5px;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.card .pl{text-align:right;font-weight:700;font-size:17px}
.card .px{font-size:12.5px;color:var(--muted)}
.card .pct{text-align:right;font-size:12px;font-weight:600}
.card .why{grid-column:1/-1;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}
.bar{grid-column:1/-1;height:5px;border-radius:9px;background:var(--line);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--seg);border-radius:9px}
.badge{font-size:10.5px;font-weight:700;letter-spacing:.03em;padding:2px 7px;border-radius:6px;border:1px solid var(--line);color:var(--muted)}
.badge.ok{color:var(--up);border-color:color-mix(in srgb,var(--up) 45%,var(--line))}
.badge.bad{color:var(--down);border-color:color-mix(in srgb,var(--down) 45%,var(--line))}
.badge.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,var(--line))}
.empty{padding:22px;text-align:center;color:var(--muted);background:var(--panel);border:1px dashed var(--line);border-radius:var(--r);font-size:14px}
.past{margin-top:18px;border-top:1px solid var(--line)}
.past details{border-bottom:1px solid var(--line)}
.past summary{display:flex;justify-content:space-between;padding:12px 2px;cursor:pointer;font-size:14px;list-style:none}
.past summary::-webkit-details-marker{display:none}
.past summary b{font-weight:600}
.past .cards{padding-bottom:12px}
.info{margin-top:18px;font-size:13px;color:var(--muted)}
.info summary{cursor:pointer;font-weight:600;color:var(--fg)}
.info dl{display:grid;grid-template-columns:max-content 1fr;gap:6px 14px;margin:10px 0 0}
.info dt{font-weight:600;color:var(--fg)}.info dd{margin:0}

/* scoreboard */
.sb{display:grid;gap:8px}
.sbrow{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}
.sbrow b{font-size:14px}
.sbrow .v{font-size:12px;color:var(--muted)}
.sbrow .r{text-align:right;font-weight:700}
.sbrow .bar{margin-top:4px}

/* chart sheet */
.sheet{position:fixed;inset:0;z-index:50;display:grid;align-items:end;background:rgba(0,0,0,.45)}
.sheet .box{background:var(--panel);border-radius:18px 18px 0 0;padding:14px 14px calc(18px + env(safe-area-inset-bottom));max-width:820px;width:100%;margin:0 auto;max-height:92vh;overflow:auto}
@media (min-width:760px){.sheet{align-items:center}.sheet .box{border-radius:18px}}
.sheet .hd{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.sheet .hd b{font-size:18px}
.sheet .hd span{color:var(--muted);font-size:12.5px;flex:1}
.views{display:flex;gap:6px;margin:6px 0 8px}
.views button{border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:5px 11px;font-size:12.5px;cursor:pointer}
.views button[aria-pressed="true"]{background:var(--fg);color:var(--panel);border-color:var(--fg)}
.chartbox svg{display:block;width:100%;height:auto}
.chartbox text{fill:var(--muted);font-size:10px;font-family:var(--font)}
.legend{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:6px}
.legend i{display:inline-block;width:14px;border-top:2px dashed currentColor;vertical-align:middle;margin-right:4px}

footer{margin-top:28px;font-size:12px;color:var(--muted);display:grid;gap:6px}
footer a{font-weight:600}
.skel{height:84px;border-radius:var(--r);background:linear-gradient(90deg,var(--panel),var(--soft),var(--panel));background-size:200% 100%;animation:sk 1.2s linear infinite;border:1px solid var(--line)}
@keyframes sk{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}.card{transition:none}}
@media (max-width:420px){.chip{min-width:118px}.seg-head h1{font-size:18px}.total b{font-size:18px}}
</style>
</head>
<body>
<header class="top"><div class="in">
  <div class="brand"><svg viewBox="0 0 108 108" aria-hidden="true"><rect width="108" height="108" fill="#0b7e6a"/><path d="M38 34v40M54 28v52M70 38v30" stroke="#fff" stroke-width="3" stroke-linecap="round"/><path d="M34 44h8v18h-8zM50 38h8v26h-8zM66 46h8v12h-8z" fill="#fff"/></svg>NSE Picks</div>
  <div class="clock" aria-live="off"><b id="clk-time">--:--:--</b><span id="clk-date">IST</span></div>
  <button class="icon-btn" id="theme" type="button" aria-label="Switch light or dark"><svg viewBox="0 0 24 24"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7z"/></svg></button>
</div></header>

<main class="wrap">
  <section class="market" id="market" aria-label="Market"></section>
  <section class="today" id="today" aria-label="Today"><h2>Today</h2><div class="skel"></div></section>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Stock types"></nav>
  <section class="seg" id="seg" role="tabpanel"><div class="skel"></div></section>
  <footer id="foot">
    <span id="built">Loading…</span>
    <span>Paper trades only: nothing here is a real order. Rs 50,000 a trade, after Zerodha charges. Not financial advice.</span>
    <span><a href="https://github.com/AshokKumar3502/nse-picks-tracker/releases/download/android-app/nse-picks-tracker.apk">Android app (APK)</a> · <a href="classic.html">Classic full view</a></span>
  </footer>
</main>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sh-sym"><div class="box">
  <div class="hd"><b id="sh-sym">-</b><span id="sh-sub"></span><button class="icon-btn" id="sh-x" type="button" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="views" id="sh-views"></div>
  <div class="chartbox" id="sh-chart"></div>
  <div class="legend" id="sh-legend"></div>
</div></div>

<script>
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };
  const N = (v) => (v === null || v === undefined || v === '' || Number.isNaN(+v)) ? null : +v;
  const inr = (v) => { const n = N(v); if (n === null) return '–'; return (n < 0 ? '−₹' : n > 0 ? '+₹' : '₹') + Math.abs(Math.round(n)).toLocaleString('en-IN'); };
  const px = (v) => { const n = N(v); return n === null ? '–' : '₹' + n.toLocaleString('en-IN', {minimumFractionDigits: 2, maximumFractionDigits: 2}); };
  const pct = (v) => { const n = N(v); return n === null ? '' : (n > 0 ? '+' : '') + n.toFixed(2) + '%'; };
  const tone = (v) => { const n = N(v); return n === null || n === 0 ? 'muted' : n > 0 ? 'up' : 'down'; };
  const IST = {timeZone: 'Asia/Kolkata'};
  const todayIST = () => new Intl.DateTimeFormat('en-CA', IST).format(new Date());
  const dLong = (s) => s ? new Date(s + 'T00:00:00Z').toLocaleDateString('en-IN', {weekday: 'short', day: 'numeric', month: 'short', timeZone: 'UTC'}) : '';
  const t12 = (hm) => { if (!hm) return ''; const [h, m] = hm.split(':').map(Number); return ((h + 11) % 12 + 1) + ':' + String(m).padStart(2, '0') + (h < 12 ? ' AM' : ' PM'); };

  // ---------------- clock and theme
  const fT = new Intl.DateTimeFormat('en-GB', Object.assign({hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false}, IST));
  const fD = new Intl.DateTimeFormat('en-IN', Object.assign({weekday: 'short', day: 'numeric', month: 'short'}, IST));
  function tick() { const d = new Date(); $('clk-time').textContent = fT.format(d); $('clk-date').textContent = fD.format(d) + ' · IST'; }
  tick(); setInterval(tick, 1000);
  try { const th = localStorage.getItem('theme'); if (th) document.documentElement.dataset.theme = th; } catch (e) { /* storage unavailable */ }
  $('theme').addEventListener('click', () => {
    const dark = document.documentElement.dataset.theme === 'dark' || (!document.documentElement.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark ? 'light' : 'dark';
    try { localStorage.setItem('theme', document.documentElement.dataset.theme); } catch (e) { /* storage unavailable */ }
  });

  // ---------------- segments: one per kind of stock
  const SEGS = [
    {id: 'buy', name: 'Buy today', sub: 'Intraday', color: 'var(--c-buy)', types: ['Intraday'], key: 'for_day', sameDay: true,
     plan: 'Bought at 9:20 AM (the 9:15 candle close), sold at 3:15 PM, same day.'},
    {id: 'sell', name: 'Sell today', sub: 'Intraday short', color: 'var(--c-sell)', types: ['Short', 'Fade'], key: 'for_day', sameDay: true,
     plan: 'Paper short: sold at 9:20 AM, bought back at 3:15 PM. Profit when the price falls.'},
    {id: 'swing', name: 'Swing', sub: '5-10 days', color: 'var(--c-swing)', types: ['Swing'], key: 'list_date',
     plan: 'Made after the close, bought next morning at 9:20, sold at the day 5 close (checklist) or day 10 close (tested rule).'},
    {id: 'results', name: 'Results jump', sub: '40 days', color: 'var(--c-res)', types: ['Results'], key: 'list_date',
     plan: 'Stocks that jumped on quarterly results: bought next morning at 9:20, held up to 40 trading days.'},
    {id: 'hold', name: '20-day hold', sub: 'Uptrend', color: 'var(--c-hold)', types: ['Hold20'], key: 'list_date',
     plan: 'Uptrend stocks bought next morning at 9:20 and held 20 trading days.'},
    {id: 'score', name: 'Scoreboard', sub: 'Which rule works', color: 'var(--c-score)'},
  ];
  let D = null, IDX = [], cur = 'buy';

  function plOf(r) {           // final after charges, else live before charges
    if (N(r.profit_net) !== null && (r.status === 'Done' || SEGS[0].types.includes(r.type) || ['Short', 'Fade'].includes(r.type))) return {v: N(r.profit_net), live: false};
    if (N(r.now_pl) !== null) return {v: N(r.now_pl), live: true};
    if (N(r.profit_net) !== null) return {v: N(r.profit_net), live: false};
    return null;
  }
  function stateLine(r, sameDay) {
    const sh = r.profit_shares ? ' · ' + r.profit_shares + ' sh' : '';
    const short = ['Short', 'Fade'].includes(r.type);
    if (!r.buy_price) return 'Waiting for the 9:20 AM ' + (short ? 'short' : 'buy');
    const first = (short ? 'Sold ' : 'Bought ') + px(r.buy_price) + sh;
    if (sameDay) {
      if (N(r.sell_price) !== null) return first + ' → ' + (short ? 'bought back ' : 'sold ') + px(r.sell_price) + ' at 3:15';
      if (N(r.now_price) !== null) return first + ' · now ' + px(r.now_price) + ' (' + t12(r.now_time) + ')';
      return first + ' · waiting for 3:15 PM';
    }
    if (N(r.now_price) !== null) return first + ' · now ' + px(r.now_price);
    if (N(r.latest_price) !== null) return first + ' · last close ' + px(r.latest_price);
    return first;
  }
  function card(r, seg) {
    const b = el('button', 'card'); b.type = 'button'; b.style.setProperty('--seg', seg.color);
    const sym = el('div', 'sym', r.symbol);
    if (r.verdict) sym.appendChild(el('span', 'badge ' + (r.verdict === 'TAKE' ? 'ok' : r.verdict === 'SKIP' ? 'bad' : 'warn'), r.verdict));
    if (r.type === 'Fade') sym.appendChild(el('span', 'badge bad', 'GAP-UP ' + pct(r.gap_pct)));
    if (r.chase) sym.appendChild(el('span', 'badge warn', 'CHASING ' + pct(r.chase_pct)));
    if (r.gap_skip) sym.appendChild(el('span', 'badge bad', 'SKIP: GAP ' + pct(r.gap_pct)));
    const p = plOf(r);
    const plEl = el('div', 'pl ' + tone(p && p.v), p ? inr(p.v) : '–');
    const pctTxt = seg.sameDay ? (N(r.sell_price) !== null ? pct(r.day_pct) : pct(r.now_pct)) : pct(N(r.now_pct) !== null ? r.now_pct : r.latest_pct);
    b.append(sym, plEl, el('div', 'px', stateLine(r, seg.sameDay)),
      el('div', 'pct ' + tone(p && p.v), p ? (p.live ? 'now · ' : 'after charges · ') + pctTxt : ''));
    if (!seg.sameDay && r.buy_price) {
      const hold = N(r.hold_days) || 5, done = Math.min(N(r.sessions_after) || 0, hold);
      const bar = el('div', 'bar'), fill = el('i'); fill.style.width = (done / hold * 100) + '%'; bar.appendChild(fill);
      b.append(bar, el('div', 'why', 'Day ' + done + ' of ' + hold + (r.reason ? ' · ' + r.reason : '')));
    } else if (r.reason) b.appendChild(el('div', 'why', r.reason));
    b.setAttribute('aria-label', r.symbol + ', ' + (p ? inr(p.v) : 'no result yet'));
    b.addEventListener('click', () => openChart(r, seg));
    return b;
  }
  function groups(seg) {
    const rows = (D.rows || []).filter((r) => seg.types.includes(r.type));
    const days = [...new Set(rows.map((r) => r[seg.key]))].filter(Boolean).sort().reverse();
    return days.map((d) => ({day: d, rows: rows.filter((r) => r[seg.key] === d).sort((a, b) => (a.type > b.type ? 1 : a.type < b.type ? -1 : a.rank - b.rank))}));
  }
  const sumPL = (rows) => { let s = 0, n = 0, live = false; for (const r of rows) { const p = plOf(r); if (p) { s += p.v; n++; live = live || p.live; } } return n ? {v: s, live} : null; };

  // ---------------- top: market chips and today's notes
  function market() {
    const box = $('market'); box.replaceChildren();
    for (const r of IDX) {
      const c = el('div', 'chip'); c.append(el('small', '', r.index), el('b', '', (+r.close).toLocaleString('en-IN', {maximumFractionDigits: 2})));
      c.querySelector('b').appendChild(el('i', tone(r.change_pct), pct(r.change_pct))); box.appendChild(c);
    }
    const M = D && D.mood_today;
    if (M) {
      const c = el('div', 'chip mood'); c.append(el('small', '', 'Market mood'), el('b', M.label === 'Bullish' ? 'up' : M.label === 'Bearish' ? 'down' : '', M.label + (M.stretched ? ' · stretched' : '')));
      box.appendChild(c);
    }
  }
  function todayBox() {
    const box = $('today'); box.replaceChildren(el('h2', '', 'Today · ' + dLong(todayIST())));
    const ul = el('ul'), add = (html) => { const li = el('li'); li.innerHTML = html; ul.appendChild(li); };
    const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'})[c]);
    const NL = D.nifty_live, M = D.mood_today, T = todayIST();
    if (NL && NL.day === T && NL.prev_close) {
      const ch = ((NL.now / NL.prev_close - 1) * 100).toFixed(2);
      add('NIFTY now <b class="' + (ch >= 0 ? 'up' : 'down') + '">' + (+NL.now).toLocaleString('en-IN') + ' (' + (ch >= 0 ? '+' : '') + ch + '%)</b> at ' + t12(NL.now_time) + '.');
    }
    if (M && M.stretched) add('<b>Stretched market</b> (NIFTY ' + (+M.stretch_pct).toFixed(1) + '% above its 20-day average): take only the Judge\'s TAKE names, or none.');
    const intra = (D.rows || []).filter((r) => r.type === 'Intraday' && r.for_day === T);
    const waits = intra.filter((r) => r.verdict === 'WAIT' || r.verdict === 'SKIP').map((r) => r.symbol);
    if (waits.length) add('<b>Skip WAIT names:</b> ' + esc(waits.join(', ')) + '.');
    const chased = intra.filter((r) => r.chase).map((r) => r.symbol);
    if (chased.length) add('<b>Don\'t chase:</b> ' + esc(chased.join(', ')) + ' (already 2%+ up at 9:20).');
    const DT = D.dont_touch;
    if (DT && DT.items && DT.items.length) add('<b>Don\'t touch ' + dLong(DT.for_day) + ':</b> ' + esc(DT.items.map((x) => x.symbol).join(', ')) + '.');
    if (D.exposure && D.exposure.warn) add('<b>One sector:</b> ' + D.exposure.by_industry[0][1] + ' of ' + D.exposure.open + ' open trades are ' + esc(D.exposure.by_industry[0][0]) + '.');
    if (!ul.children.length) add('No special warnings today.');
    box.appendChild(ul);
    const more = el('details', 'more'); more.appendChild(el('summary', '', 'Always-on care rules'));
    const ul2 = el('ul');
    for (const t of ['Intraday buying loses about 0.33% a trade on average after charges (2019-2026): keep trades few and small.',
      'Decide your maximum loss before buying (for example ₹500 on ₹50,000) and stop after two losing trades.',
      'NIFTY being up or down at 9:20 did not predict the day in our tests; weak openings often recovered.',
      'Swing and longer holds are judged at the end of the hold; tested stops made them worse.']) ul2.appendChild(el('li', '', t));
    more.appendChild(ul2); box.appendChild(more);
  }

  // ---------------- tabs and panels
  function tabs() {
    const nav = $('tabs'); nav.replaceChildren();
    for (const s of SEGS) {
      const b = el('button', 'tab'); b.type = 'button'; b.role = 'tab'; b.style.setProperty('--seg', s.color);
      b.setAttribute('aria-selected', String(s.id === cur));
      b.append(el('span', 'dot'), document.createTextNode(s.name));
      if (s.types) { const g = groups(s)[0]; b.appendChild(el('span', 'n', g ? String(g.rows.length) : '0')); }
      b.addEventListener('click', () => { cur = s.id; try { history.replaceState(null, '', '#' + s.id); } catch (e) { /* ignore */ } tabs(); panel(); window.scrollTo({top: 0}); });
      nav.appendChild(b);
    }
  }
  function notesFor(seg) {
    const out = [], T = todayIST(), add = (txt, warn) => out.push(el('div', 'note' + (warn ? ' warn' : ''), txt));
    if (seg.id === 'buy') {
      const s = (D.scoreboard || {}).rows || [], r = s.find((x) => x.key === 'intraday');
      if (r && r.closed) add('So far: ' + r.closed + ' trades, ' + (r.win_pct || 0).toFixed(0) + '% made money, ' + inr(r.total_net_rs) + ' after charges. ' + (r.verdict || ''), (r.total_net_rs || 0) < 0);
    }
    if (seg.id === 'sell') {
      add('In 2019-2026 tests, shorting weak stocks lost about 0.14% a trade even on bearish days; only the gap-up fade (stocks opening 3%+ higher) made money. Paper only.', true);
      const F = D.fade_today;
      if (F && F.for_day === T) add(F.stand_aside ? 'Gap-up fade stands aside today.' : (F.count ? F.count + ' gap-up fade ' + (F.count === 1 ? 'stock' : 'stocks') + ' today.' : 'No F&O stock opened 3%+ higher today (' + F.scanned + ' checked).') + ((F.problems || []).length ? ' ' + F.problems.join('; ') : ''), (F.problems || []).length > 0);
    }
    if (seg.id === 'results') {
      const R = D.results_today;
      if (R) add((R.stand_aside ? 'NIFTY is under its 200-day average: the rule stands aside. ' : '') + (R.jumps ? R.jumps + ' results jump(s) at the close of ' + dLong(R.session) + '.' : 'No results jump at the close of ' + dLong(R.session) + '.') +
        ((R.falls || []).length ? ' Don\'t buy (results fall): ' + R.falls.map((x) => x.symbol).join(', ') + '.' : '') + (R.failed ? ' NSE did not answer for ' + R.failed + ' stocks.' : ''), R.failed > 0);
    }
    if (seg.id === 'hold' && D.hold20_today && D.hold20_today.rule) add(D.hold20_today.rule);
    return out;
  }
  function panel() {
    const seg = SEGS.find((s) => s.id === cur) || SEGS[0], box = $('seg');
    box.style.setProperty('--seg', seg.color); box.replaceChildren();
    if (seg.id === 'score') return scoreboard(box, seg);
    const gs = groups(seg), latest = gs[0];
    const head = el('div', 'seg-head'), h = el('h1', '', seg.name + ' · ' + seg.sub);
    head.appendChild(h);
    const tot = latest ? sumPL(latest.rows) : null;
    if (tot) { const t = el('div', 'total'); t.append(el('b', tone(tot.v), inr(tot.v)), el('span', '', tot.live ? 'now, before charges' : 'after charges')); head.appendChild(t); }
    head.appendChild(el('p', 'plan', seg.plan));
    box.appendChild(head);
    const nts = notesFor(seg); if (nts.length) { const n = el('div', 'notes'); n.append(...nts); box.appendChild(n); }
    if (!latest) { box.appendChild(el('div', 'empty', 'No list yet. It appears here as soon as the agents make one.')); return; }
    const made = latest.rows.find((r) => r.made_at);
    const lab = el('div', 'day-label'); lab.append(el('b', '', (seg.sameDay ? 'For ' : 'Made ') + dLong(latest.day)), el('span', '', made ? 'made ' + t12(made.made_at) : ''));
    box.appendChild(lab);
    const cs = el('div', 'cards'); cs.append(...latest.rows.map((r) => card(r, seg))); box.appendChild(cs);
    if (gs.length > 1) {
      const past = el('div', 'past'); past.appendChild(el('div', 'day-label', 'Earlier lists'));
      for (const g of gs.slice(1)) {
        const d = el('details'), s = el('summary'), t = sumPL(g.rows);
        s.append(el('b', '', dLong(g.day) + ' · ' + g.rows.length + (g.rows.length === 1 ? ' stock' : ' stocks')), el('span', tone(t && t.v), t ? inr(t.v) : '–'));
        d.appendChild(s);
        d.addEventListener('toggle', () => { if (d.open && d.children.length === 1) { const c = el('div', 'cards'); c.append(...g.rows.map((r) => card(r, seg))); d.appendChild(c); } });
        past.appendChild(d);
      }
      box.appendChild(past);
    }
  }
  function scoreboard(box, seg) {
    const head = el('div', 'seg-head'); head.append(el('h1', '', 'Scoreboard'), el('p', 'plan', 'Each rule\'s real paper record since 17 Nov 2026. A verdict needs ' + ((D.scoreboard || {}).min_trades || 20) + ' finished trades.'));
    box.appendChild(head);
    const list = el('div', 'sb');
    for (const r of ((D.scoreboard || {}).rows || [])) {
      const row = el('div', 'sbrow'), left = el('div');
      left.append(el('b', '', r.rule), el('div', 'v', r.verdict || ''));
      const bar = el('div', 'bar'), fill = el('i'); fill.style.width = Math.min(100, (r.closed || 0) / ((D.scoreboard || {}).min_trades || 20) * 100) + '%'; fill.style.background = 'var(--c-score)'; bar.appendChild(fill); left.appendChild(bar);
      const right = el('div', 'r ' + tone(r.total_net_rs)); right.append(document.createTextNode(r.closed ? inr(r.total_net_rs) : '–'), el('div', 'v', (r.closed || 0) + ' trades' + (r.closed ? ' · ' + (r.win_pct || 0).toFixed(0) + '% won' : '')));
      row.append(left, right); list.appendChild(row);
    }
    box.appendChild(list);
  }

  // ---------------- candle chart sheet
  let chartDoc = null, chartRow = null;
  function openChart(r, seg) {
    chartRow = r; $('sh-sym').textContent = r.symbol; $('sh-sub').textContent = seg.name + ' · ' + dLong(seg.sameDay ? r.for_day : r.list_date);
    $('sh-views').replaceChildren(); $('sh-legend').replaceChildren(); $('sh-chart').replaceChildren(el('div', 'skel'));
    $('sheet').hidden = false; document.body.style.overflow = 'hidden'; $('sh-x').focus();
    fetch('data/charts/' + encodeURIComponent(r.symbol.replace(/&/g, '_')) + '.json?v=' + Date.now(), {cache: 'no-store'})
      .then((x) => { if (!x.ok) throw new Error('no chart'); return x.json(); })
      .then((doc) => {
        chartDoc = doc;
        const day = seg.sameDay ? r.for_day : (r.buy_date || r.trade_on);
        const views = [];
        if (doc.m5 && doc.m5[day]) views.push({label: '5-min · ' + dLong(day), bars: doc.m5[day], intra: true});
        if ((doc.daily || []).length) views.push({label: 'Daily · 3 months', bars: doc.daily.slice(-66), intra: false});
        if (!views.length) throw new Error('no chart');
        views.forEach((v, i) => { const b = el('button', '', v.label); b.type = 'button'; b.addEventListener('click', () => { [...$('sh-views').children].forEach((x) => x.setAttribute('aria-pressed', 'false')); b.setAttribute('aria-pressed', 'true'); draw(v); }); $('sh-views').appendChild(b); if (i === 0) { b.setAttribute('aria-pressed', 'true'); draw(v); } });
      })
      .catch(() => $('sh-chart').replaceChildren(el('div', 'empty', 'No chart saved for this stock yet.')));
  }
  function closeChart() { $('sheet').hidden = true; document.body.style.overflow = ''; }
  $('sh-x').addEventListener('click', closeChart);
  $('sheet').addEventListener('click', (e) => { if (e.target === $('sheet')) closeChart(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('sheet').hidden) closeChart(); });
  function draw(view) {
    const r = chartRow, bars = view.bars.map((b) => ({k: b[0], o: b[1], h: b[2], l: b[3], c: b[4]}));
    const W = Math.max(300, $('sh-chart').clientWidth || 600), H = Math.round(Math.min(360, Math.max(220, W * 0.55))), m = {t: 10, r: 52, b: 20, l: 4};
    const lines = [];
    const short = ['Short', 'Fade'].includes(r.type);
    if (N(r.buy_price) !== null) lines.push({y: +r.buy_price, c: 'var(--accent)', t: (short ? 'Sold ' : 'Bought ') + px(r.buy_price)});
    if (N(r.sell_price) !== null) lines.push({y: +r.sell_price, c: 'var(--warn)', t: (short ? 'Bought back ' : 'Sold ') + px(r.sell_price)});
    let lo = Math.min(...bars.map((b) => b.l)), hi = Math.max(...bars.map((b) => b.h));
    for (const L of lines) if (L.y > lo * 0.97 && L.y < hi * 1.03) { lo = Math.min(lo, L.y); hi = Math.max(hi, L.y); }
    const pad = (hi - lo) * 0.06 || hi * 0.01; lo -= pad; hi += pad;
    const step = (W - m.l - m.r) / bars.length, X = (i) => m.l + i * step + step / 2, Y = (v) => m.t + (hi - v) / (hi - lo) * (H - m.t - m.b);
    const NS = 'http://www.w3.org/2000/svg', svg = document.createElementNS(NS, 'svg'), mk = (tag, at) => { const e = document.createElementNS(NS, tag); for (const k in at) e.setAttribute(k, at[k]); return e; };
    svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H); svg.setAttribute('role', 'img'); svg.setAttribute('aria-label', r.symbol + ' candle chart');
    for (let i = 0; i <= 4; i++) { const v = lo + (hi - lo) * i / 4, y = Y(v); svg.appendChild(mk('line', {x1: m.l, x2: W - m.r, y1: y, y2: y, stroke: 'var(--line)'})); const t = mk('text', {x: W - m.r + 4, y: y + 3}); t.textContent = v.toLocaleString('en-IN', {maximumFractionDigits: v > 1000 ? 0 : 1}); svg.appendChild(t); }
    const bw = Math.max(1, step * 0.65);
    bars.forEach((b, i) => {
      const col = b.c >= b.o ? 'var(--up)' : 'var(--down)';
      svg.appendChild(mk('line', {x1: X(i), x2: X(i), y1: Y(b.h), y2: Y(b.l), stroke: col}));
      svg.appendChild(mk('rect', {x: X(i) - bw / 2, y: Y(Math.max(b.o, b.c)), width: bw, height: Math.max(1, Math.abs(Y(b.o) - Y(b.c))), fill: col}));
    });
    for (const L of lines) svg.appendChild(mk('line', {x1: m.l, x2: W - m.r, y1: Y(L.y), y2: Y(L.y), stroke: L.c, 'stroke-dasharray': '5 4', 'stroke-width': 1.4}));
    const every = Math.max(1, Math.ceil(bars.length / 6));
    bars.forEach((b, i) => { if (i % every === 0) { const t = mk('text', {x: X(i), y: H - 5, 'text-anchor': 'middle'}); t.textContent = view.intra ? t12(b.k) : dLong(b.k); svg.appendChild(t); } });
    $('sh-chart').replaceChildren(svg);
    const hiB = bars.reduce((a, b) => (b.h > a.h ? b : a)), loB = bars.reduce((a, b) => (b.l < a.l ? b : a));
    $('sh-legend').replaceChildren(...lines.map((L) => { const s = el('span'); const i = el('i'); i.style.color = L.c; s.append(i, L.t); return s; }),
      el('span', '', 'High ' + px(hiB.h) + ' · Low ' + px(loB.l) + ' · Last ' + px(bars[bars.length - 1].c)));
  }

  // ---------------- load
  function render() { market(); todayBox(); tabs(); panel(); }
  function load() {
    Promise.all([
      fetch('data/picks.json?v=' + Date.now(), {cache: 'no-store'}).then((r) => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); }),
      fetch('data/indices.json?v=' + Date.now(), {cache: 'no-store'}).then((r) => r.ok ? r.json() : {rows: []}).catch(() => ({rows: []})),
    ]).then(([doc, ix]) => {
      D = doc; IDX = ix.rows || [];
      const h = (location.hash || '').slice(1); if (SEGS.some((s) => s.id === h)) cur = h;
      const built = (doc.meta || []).find((m) => m.label === 'Built');
      const by = (doc.meta || []).find((m) => m.label === 'Run by');
      $('built').textContent = built ? 'Data updated ' + built.value + (by ? ' by the ' + by.value : '') + '.' : '';
      render();
    }).catch((e) => {
      $('seg').replaceChildren(el('div', 'empty', 'The data could not be loaded (' + e.message + '). Check the internet connection.'));
      const b = el('button', 'tab', 'Try again'); b.type = 'button'; b.style.margin = '12px auto'; b.style.display = 'flex'; b.addEventListener('click', load); $('seg').appendChild(b);
      $('today').replaceChildren(el('h2', '', 'Today'), el('div', 'muted', 'Waiting for data…'));
    });
  }
  window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (D && SEGS.some((s) => s.id === h) && h !== cur) { cur = h; tabs(); panel(); } });
  load();
})();
</script>
