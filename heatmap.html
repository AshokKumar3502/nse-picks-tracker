<style>
/* Layout: trading-terminal board. Index quotes up top, full-width treemap, industry ladder and movers below. */
:root{
  --bg:#f4f6f5; --panel:#ffffff; --fg:#14201b; --muted:#5b6b64; --line:#d9e0dc;
  --up:#0f8a4f; --down:#c8323a; --flat:#e4e9e6; --tileline:#f4f6f5;
  --display:"Archivo",system-ui,sans-serif; --body:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1311; --panel:#141c19; --fg:#e6eee9; --muted:#8fa199; --line:#25302b;
  --up:#1fa463; --down:#e0474f; --flat:#26302c; --tileline:#0d1311; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1311; --panel:#141c19; --fg:#e6eee9; --muted:#8fa199; --line:#25302b;
  --up:#1fa463; --down:#e0474f; --flat:#26302c; --tileline:#0d1311; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);margin:0}
.wrap{max-width:1400px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:18px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(22px,3.2vw,30px);margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--muted);font-size:13px;margin-top:4px}
.quotes{display:flex;flex-wrap:wrap;gap:8px}
.q{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums;display:grid;gap:2px;min-width:0}
.q b{font-family:var(--body);font-weight:600;font-size:11px;letter-spacing:.06em;color:var(--muted)}
.pos{color:var(--up)} .neg{color:var(--down)}
.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--panel)}
.seg button{font:500 13px var(--body);color:var(--muted);background:none;border:0;padding:7px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.seg button:focus-visible{outline:2px solid var(--up);outline-offset:-2px}
.breadth{font-size:13px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.legend{display:flex;align-items:center;gap:4px;font:12px var(--mono);color:var(--muted)}
.legend i{display:block;width:22px;height:12px;border-radius:2px}
.legend span{margin-left:6px}
#map{position:relative;width:100%;height:min(72vh,760px);min-height:420px;background:var(--tileline);border-radius:6px;overflow:hidden}
.tile{position:absolute;overflow:hidden;border:1px solid var(--tileline);padding:3px 4px;line-height:1.15;cursor:default}
.tile .s{font-weight:600;white-space:nowrap}
.tile .p{font:11px var(--mono);font-variant-numeric:tabular-nums;opacity:.92}
.grp{position:absolute;pointer-events:none;border:2px solid var(--tileline)}
.grp span{position:absolute;left:0;top:0;font:600 10px var(--body);letter-spacing:.05em;text-transform:uppercase;padding:1px 5px;background:var(--tileline);color:var(--muted);border-bottom-right-radius:4px;max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#tip{position:fixed;pointer-events:none;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:12px;box-shadow:0 6px 20px rgba(0,0,0,.18);z-index:5;max-width:280px}
#tip .nm{font-weight:600;margin-bottom:2px}
#tip .in{color:var(--muted);margin-bottom:4px}
#tip table{border-collapse:collapse;font-family:var(--mono);font-variant-numeric:tabular-nums}
#tip td{padding:1px 8px 1px 0}
.lower{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr);gap:18px}
@media (max-width:900px){.lower{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;min-width:0}
.card h2{font:600 12px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.ladder{display:grid;gap:5px}
.lr{display:grid;grid-template-columns:minmax(0,1fr) 110px 62px;gap:8px;align-items:center;font-size:13px}
.lr .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lr .k{color:var(--muted);font-size:11px}
.track{position:relative;height:10px;background:var(--flat);border-radius:2px}
.track i{position:absolute;top:0;bottom:0;border-radius:2px}
.track::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--muted)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;font-size:12px;white-space:nowrap}
table.mv{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed}
table.mv td{padding:4px 0;border-bottom:1px solid var(--line)}
table.mv td.num{width:84px}
table.mv tr:last-child td{border-bottom:0}
.mv .co{color:var(--muted);font-size:11px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
footer{color:var(--muted);font-size:12px;line-height:1.5;max-width:900px}
@media (prefers-reduced-motion:no-preference){.tile{transition:background-color .25s}}
</style>

function pal(){PAL={up:hex(css("--up")),down:hex(css("--down")),flat:hex(css("--flat")),fg:css("--fg")}}
function color(v){
  const t=Math.max(-1,Math.min(1,v/KS[K].max));
  const c=t>=0?mix(PAL.flat,PAL.up,Math.pow(t,.8)):mix(PAL.flat,PAL.down,Math.pow(-t,.8));
  return{bg:"rgb("+c.join(",")+")",fg:Math.abs(t)>.35?"#ffffff":PAL.fg};
}

// squarified treemap: items sorted by v, descending
function worst(row,s){let sum=0,mx=0,mn=Infinity;for(const r of row){sum+=r.a;mx=Math.max(mx,r.a);mn=Math.min(mn,r.a)}
  return Math.max(s*s*mx/(sum*sum),sum*sum/(s*s*mn))}
function squarify(items,x,y,w,h){
  const out=[];const total=items.reduce((a,b)=>a+b.v,0);if(!total||w<=0||h<=0)return out;
  const scale=w*h/total;let rest=items.map(it=>({it,a:it.v*scale}));
  while(rest.length){
    const short=Math.min(w,h);let row=[rest[0]],best=worst(row,short),i=1;
    while(i<rest.length){const nr=row.concat(rest[i]);const wv=worst(nr,short);if(wv<=best){row=nr;best=wv;i++}else break}
    const sum=row.reduce((a,b)=>a+b.a,0);
    if(w>=h){const cw=sum/h;let cy=y;for(const r of row){const rh=r.a/cw;out.push({x,y:cy,w:cw,h:rh,d:r.it});cy+=rh}x+=cw;w-=cw}
    else{const ch=sum/w;let cx=x;for(const r of row){const rw=r.a/ch;out.push({x:cx,y,w:rw,h:ch,d:r.it});cx+=rw}y+=ch;h-=ch}
    rest=rest.slice(row.length);
  }
  return out;
}

const byInd={};for(const s of S){(byInd[s.i]=byInd[s.i]||[]).push(s)}
const G=Object.keys(byInd).map(n=>{const a=byInd[n].sort((x,y)=>y.t-x.t);return{n,a,v:a.reduce((p,q)=>p+q.t,0)}}).sort((a,b)=>b.v-a.v);

function draw(){
  const map=$("map");map.innerHTML="";const W=map.clientWidth,H=map.clientHeight;
  for(const g of squarify(G,0,0,W,H)){
    const pad=(g.w>70&&g.h>40)?14:0;
    const gd=document.createElement("div");gd.className="grp";
    Object.assign(gd.style,{left:g.x+"px",top:g.y+"px",width:g.w+"px",height:g.h+"px"});
    if(pad){const sp=document.createElement("span");sp.textContent=g.d.n;gd.appendChild(sp)}
    const tiles=squarify(g.d.a.map(s=>({v:s.t,s})),g.x,g.y+pad,g.w,g.h-pad);
    for(const t of tiles){
      const s=t.d.s,c=color(s[K]);const el=document.createElement("div");el.className="tile";
      Object.assign(el.style,{left:t.x+"px",top:t.y+"px",width:t.w+"px",height:t.h+"px",background:c.bg,color:c.fg});
      if(t.w>34&&t.h>16){
        const fs=Math.max(9,Math.min(18,Math.sqrt(t.w*t.h)/6));
        el.innerHTML='<div class="s" style="font-size:'+fs.toFixed(1)+'px">'+esc(s.s)+'</div>'+((t.h>32&&t.w>44)?'<div class="p">'+pct(s[K])+'</div>':"");
      }
      el.addEventListener("mousemove",e=>tip(e,s));
      el.addEventListener("mouseleave",()=>{$("tip").hidden=true});
      el.addEventListener("click",e=>tip(e,s));
      map.appendChild(el);
    }
    map.appendChild(gd);
  }
}
function tip(e,s){
  const t=$("tip");t.hidden=false;
  t.innerHTML='<div class="nm">'+esc(s.s)+' &middot; '+esc(s.n)+'</div><div class="in">'+esc(s.i)+'</div><table>'+
    '<tr><td>Close</td><td>&#8377;'+fmt(s.c)+'</td></tr>'+
    '<tr><td>1 day</td><td class="'+cls(s.d1)+'">'+pct(s.d1)+'</td></tr>'+
    '<tr><td>1 week</td><td class="'+cls(s.d5)+'">'+pct(s.d5)+'</td></tr>'+
    '<tr><td>1 month</td><td class="'+cls(s.d20)+'">'+pct(s.d20)+'</td></tr>'+
    '<tr><td>Turnover</td><td>&#8377;'+fmt(s.tt,1)+' cr today</td></tr>'+
    '<tr><td>20-day avg</td><td>&#8377;'+fmt(s.t,1)+' cr</td></tr></table>';
  const r=t.getBoundingClientRect();let x=e.clientX+14,y=e.clientY+14;
  if(x+r.width>innerWidth-8)x=e.clientX-r.width-14;
  if(y+r.height>innerHeight-8)y=e.clientY-r.height-14;
  t.style.left=Math.max(8,x)+"px";t.style.top=Math.max(8,y)+"px";
}
function side(){
  const up=S.filter(s=>s[K]>0).length,dn=S.filter(s=>s[K]<0).length;
  const tot=S.reduce((a,s)=>a+s.t,0);
  const wavg=S.reduce((a,s)=>a+s[K]*s.t,0)/tot;
  const sorted=S.map(s=>s[K]).sort((a,b)=>a-b);const med=sorted[sorted.length>>1];
  $("breadth").innerHTML='<span><b class="pos">'+up+'</b> up</span><span><b class="neg">'+dn+'</b> down</span>'+
    '<span>median <b class="'+cls(med)+'">'+pct(med)+'</b></span><span>turnover-weighted <b class="'+cls(wavg)+'">'+pct(wavg)+'</b></span>';
  const m=KS[K].max;
  $("legend").innerHTML=[-m,-m/2,0,m/2,m].map(v=>'<i style="background:'+color(v).bg+'"></i>').join("")+'<span>&minus;'+m+'% to +'+m+'%</span>';
  const rows=G.map(g=>({n:g.n,k:g.a.length,v:g.a.reduce((a,s)=>a+s[K]*s.t,0)/g.v})).sort((a,b)=>b.v-a.v);
  const mx=Math.max(.5,...rows.map(r=>Math.abs(r.v)));
  $("ladder").innerHTML=rows.map(r=>{const w=Math.abs(r.v)/mx*50;
    const pos=r.v>=0?"left:50%":"left:"+(50-w)+"%";
    return '<div class="lr"><span class="nm" title="'+esc(r.n)+'">'+esc(r.n)+' <span class="k">'+r.k+'</span></span>'+
      '<span class="track"><i style="'+pos+';width:'+w+'%;background:var('+(r.v>=0?"--up":"--down")+')"></i></span>'+
      '<span class="num '+cls(r.v)+'">'+pct(r.v)+'</span></div>'}).join("");
  const srt=S.slice().sort((a,b)=>b[K]-a[K]);
  const tr=s=>'<tr><td>'+esc(s.s)+'<span class="co">'+esc(s.n)+'</span></td><td class="num">&#8377;'+fmt(s.c)+'</td><td class="num '+cls(s[K])+'">'+pct(s[K])+'</td></tr>';
  $("gain").innerHTML=srt.slice(0,10).map(tr).join("");
  $("lose").innerHTML=srt.slice(-10).reverse().map(tr).join("");
}
function render(){pal();draw();side()}

$("foot").textContent="Source: "+DATA.source+", via the india-day-trader-skill pack. Industries from NSE's "+DATA.index_name+" constituent list. "+
  (left.length?"Left out: "+left.join("; ")+". ":"")+"1 day compares this close with the one before; 1 week is 5 sessions, 1 month 20 sessions. India VIX shows its own change. Market data, not a recommendation, not financial advice.";
document.querySelectorAll(".seg button").forEach(b=>b.addEventListener("click",()=>{
  K=b.dataset.k;document.querySelectorAll(".seg button").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));render()}));
let rt;addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(draw,120)});

new MutationObserver(render).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
render();
